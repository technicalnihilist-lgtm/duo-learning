name: Capture Screenshots

# Boots an Android emulator, installs the debug APK and captures real
# screenshots of the running app into docs/screenshots/app-*.png.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure anr_show_background 0

            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.duolearning.app.debug/com.duolearning.app.MainActivity
            sleep 20

            # Dismiss any leftover "isn't responding" dialog, then bring the
            # app back to the foreground so the capture is of the app.
            adb shell input keyevent 4
            sleep 3
            adb shell am start -W -n com.duolearning.app.debug/com.duolearning.app.MainActivity
            sleep 12

            SIZE=$(adb shell wm size | tr -d '\r' | sed 's/.*: //')
            W=${SIZE%x*}
            H=${SIZE#*x}
            Y=$(( H * 945 / 1000 ))
            X1=$(( W * 14 / 100 ))
            X2=$(( W * 38 / 100 ))
            X3=$(( W * 62 / 100 ))
            X4=$(( W * 86 / 100 ))

            mkdir -p docs/screenshots
            adb exec-out screencap -p > docs/screenshots/app-learn.png

            adb shell input tap $X2 $Y; sleep 6
            adb exec-out screencap -p > docs/screenshots/app-translate.png

            adb shell input tap $X3 $Y; sleep 6
            adb exec-out screencap -p > docs/screenshots/app-practice.png

            adb shell input tap $X4 $Y; sleep 6
            adb exec-out screencap -p > docs/screenshots/app-progress.png

            ls -l docs/screenshots/app-*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/app-*.png
          git commit -m "Update real app screenshots captured on an emulator" || echo "no changes"
          git push
